[package]
name = "uc-infra-local"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Local file-system, blob, time, device and settings primitives for UniClipboard infra"
publish = false

[dependencies]
uc-core = { path = "../uc-core" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = [
  "sync",
  "fs",
  "rt-multi-thread",
  "macros",
  "time",
  "io-util",
] }
hex = "0.4.3"
blake3 = "1.8.2"
tracing = "0.1"

# Device file-share path-confinement primitive (ADR-034): capability-style directory
# handles so every share-root operation starts from an open directory fd. Containment
# strength is pinned by crates/uc-infra-local/tests/share_confinement_escape_probe.rs
# and is cross-platform (Linux/macOS/Windows) without per-platform syscall bindings.
cap-std = "4.0.3"

# ===== Blob/profile ciphertext ports consumed by migration_state only =====
uc-observability-contract = { path = "../uc-observability-contract" }
uuid = { version = "1.10.0", features = ["v4"] }
cap-fs-ext = "4.0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
uc-testkit = { path = "../../tests/uc-testkit" }

[lints]
workspace = true
